<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar uma análise | BRS Administração de Obras</title>
  <meta name="description" content="Organize as informações iniciais da sua obra para conversar com a BRS Administração de Obras.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
  <header class="site-header"><div class="shell header-inner"><a class="brand-link" href="../"><img class="brand-menu-logo" src="../../assets/branding/logo%20para%20menu%20branco.png" alt="BRS Administração de Obras"></a><a class="button small secondary" href="../">Voltar ao site</a></div></header>
  <main>
    <section class="section white">
      <div class="shell contact-grid">
        <div>
          <p class="eyebrow">Solicitação inicial</p>
          <h1 class="sr-only">Solicite uma análise</h1>
          <img class="title-art" src="../assets/images/titles/solicite-uma-analise-black.png" alt="Solicite uma análise">
          <p class="doc-muted">Este briefing organiza o primeiro contato. Não substitui levantamento técnico, visita, proposta ou contrato.</p>
          <div class="contact-list" style="margin-top: 34px">
            <a class="contact-link" data-contact-link="whatsapp"><span>WhatsApp</span><strong data-contact-label></strong></a>
            <a class="contact-link" data-contact-link="email"><span>E-mail</span><strong data-contact-label></strong></a>
          </div>
        </div>
        <form data-brief-form>
          <div class="form-grid">
            <div class="field"><label for="nome">Nome</label><input id="nome" name="nome" required></div>
            <div class="field"><label for="empresa">Empresa</label><input id="empresa" name="empresa"></div>
            <div class="field full"><label for="contato">Telefone ou e-mail</label><input id="contato" name="contato" required></div>
            <div class="field"><label for="tipo">Tipo de obra</label><select id="tipo" name="tipo"><option>Galpão ou barracão</option><option>Comercial</option><option>Industrial</option><option>BTS</option><option>Outro</option></select></div>
            <div class="field"><label for="local">Cidade / estado</label><input id="local" name="local"></div>
            <div class="field"><label for="estagio">Estágio atual</label><select id="estagio" name="estagio"><option>Ideia ou oportunidade</option><option>Terreno definido</option><option>Projetos em desenvolvimento</option><option>Orçamento / contratação</option><option>Obra em andamento</option></select></div>
            <div class="field"><label for="area">Área estimada</label><input id="area" name="area" placeholder="m²"></div>
            <div class="field full"><label for="objetivo">Objetivo do investimento</label><textarea id="objetivo" name="objetivo"></textarea></div>
            <div class="field full"><label for="desafio">Principal desafio ou risco percebido</label><textarea id="desafio" name="desafio"></textarea></div>
          </div>
          <button class="button" type="submit" style="margin-top: 22px">Organizar solicitação</button>
          <p class="form-status" data-form-status aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="shell"><img class="footer-logo" src="../assets/branding/logo-reverso.svg" alt="BRS Administração de Obras"><div class="footer-bottom">© <span data-year></span> BRS Administração de Obras</div></div></footer>
  <script src="../assets/js/config.js"></script><script src="../assets/js/site.js"></script><script src="../assets/js/forms.js"></script>
</body>
</html>
